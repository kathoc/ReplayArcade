# XcodeGen spec for the ReplayNES iPhone prototype (branch `ios`, local only).
#   cd apps/ios && xcodegen generate      (scripts/build-device.sh does this for you)
# Like apps/macos, the engine and the shared frontend core are NOT compiled here: the "Engine"
# aggregate target runs CMake on the same source lists as every other platform (single source of
# truth; scripts/build-engine.sh) for the SDK being built (iphoneos / iphonesimulator, arm64) and
# the app links the resulting static library.
# Swift shared with macOS is referenced in place from apps/macos (no copies): the pure core layer
# (Sources/Core, all of it) and the platform-neutral parts of the app layer (emulation thread,
# Metal renderer, audio output, timeline / markers, Quick Menu controller, game controllers).
# See README.md, "Architecture".
name: ReplayNES
options:
  bundleIdPrefix: io.github.replaynes
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.5.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    RN_ENGINE_BUILD_DIR: "$(SRCROOT)/../../build/ios-engine"
    RN_MACOS: "$(SRCROOT)/../macos"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../engine/include/replaynes"
      - "$(SRCROOT)/../../frontend/include/replaynes"
      - "$(SRCROOT)/../macos/Sources/Core/C"
    SWIFT_OBJC_BRIDGING_HEADER: "../macos/Sources/Core/C/Bridging.h"
    LIBRARY_SEARCH_PATHS:
      - "$(RN_ENGINE_BUILD_DIR)/$(PLATFORM_NAME)"
    OTHER_LDFLAGS: ["-lreplaynes_all", "-lc++"]
    GCC_C_LANGUAGE_STANDARD: c11
    # The String Catalogs are maintained by hand on this branch: building must never rewrite
    # apps/macos/Resources/Localizable.xcstrings (shared with main).
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

aggregateTargets:
  Engine:
    buildScripts:
      - name: Build ReplayNES engine + frontend core for iOS (CMake)
        script: '"$SRCROOT/scripts/build-engine.sh" "$PLATFORM_NAME"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(RN_ENGINE_BUILD_DIR)/$(PLATFORM_NAME)/libreplaynes_all.a"

targets:
  ReplayNES:
    type: application
    platform: iOS
    sources:
      # Shared with macOS (referenced in place).
      - path: ../macos/Sources/Core
      - path: ../macos/Sources/App/EmulationController.swift
      - path: ../macos/Sources/App/Runtime.swift
      - path: ../macos/Sources/App/LatencyMeter.swift
      - path: ../macos/Sources/App/MetalView.swift
      - path: ../macos/Sources/App/CRTSettings.swift
      - path: ../macos/Sources/App/TimelineActions.swift
      - path: ../macos/Sources/App/Filmstrip.swift
      - path: ../macos/Sources/App/SeekMarkers.swift
      - path: ../macos/Sources/App/InputManager.swift
      - path: ../macos/Sources/App/QuickMenu/QuickMenuController.swift
      - path: ../macos/Resources/Localizable.xcstrings
      # iOS only.
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/IOS.xcstrings
    dependencies:
      - target: Engine
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_NAME: ReplayNES
        PRODUCT_MODULE_NAME: ReplayNESApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ReplayNES
        # Bundle id and team: Config/Signing.xcconfig (+ your Signing.local.xcconfig).
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ReplayNES
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        LSApplicationCategoryType: public.app-category.games
        NSHumanReadableCopyright: "ReplayNES - GPL-2.0-or-later. Includes Nestopia UE (GPL-2.0-or-later). Personal test build."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # ProMotion: allow the display link to ask for 120 Hz (docs/FRAME_PACING.md).
        CADisableMinimumFrameDurationOnPhone: true
        # Files app: On My iPhone › ReplayNES (= Documents: ROM/, Projects/).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.replaynes.nesrec
            UTTypeDescription: ReplayNES Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [nesrec]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.replaynes.nes-rom
            UTTypeDescription: NES ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nes, NES]
        CFBundleDocumentTypes:
          - CFBundleTypeName: NES ROM
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.github.replaynes.nes-rom]
          - CFBundleTypeName: ReplayNES Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [io.github.replaynes.nesrec]

  # Logic tests (no host app): the shared core layer, the iOS-only pure logic (feature gating,
  # touch layout / routing) and the macOS core tests that do not need AppKit, on the simulator.
  ReplayNESTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../macos/Sources/Core
      - path: ../macos/Tests
        excludes:
          - ControllerLayoutTests.swift   # AppKit
      - path: Sources/Entitlements
      - path: Sources/Play/TouchLayout.swift
      - path: Sources/Play/TouchRouter.swift
      - path: Sources/Support/L10n.swift
      - path: Sources/Library/ROMImport.swift
      - path: Tests
    dependencies:
      - target: Engine
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.replaynes.ios.tests
        PRODUCT_MODULE_NAME: ReplayNESTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  ReplayNES:
    build:
      targets:
        ReplayNES: all
        ReplayNESTests: [test]
    test:
      targets: [ReplayNESTests]
    run:
      config: Debug
    archive:
      config: Release
