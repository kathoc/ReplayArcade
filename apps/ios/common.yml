# Product-neutral part of the iPhone app (XcodeGen), included by each product's spec:
#   apps/ios/project.yml   ReplayNES (this repository)
#   another product (ReplayArcade) keeps its own spec next to its sources and includes this file.
# Paths below are relative to this file (XcodeGen resolves them on include). Build settings that point
# into this tree use RN_IOS_DIR (this directory), which every product spec sets, so a product's
# project can live elsewhere. The product spec owns the name, versions, bundle id, the engine build
# (RN_ENGINE_BUILD_DIR, RN_ENGINE_SCRIPT), the Info.plist / entitlements files and the file types.
# The product identity the Swift code reads at run time (name, data folder, project extension, ROM
# extensions) is the engine's generated replaynes/product.h ($(RN_ENGINE_BUILD_DIR)/<sdk>/generated).
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    RN_REPO: "$(RN_IOS_DIR)/../.."
    RN_MACOS: "$(RN_IOS_DIR)/../macos"
    HEADER_SEARCH_PATHS:
      - "$(RN_ENGINE_BUILD_DIR)/$(PLATFORM_NAME)/generated"
      - "$(RN_REPO)/engine/include/replaynes"
      - "$(RN_REPO)/frontend/include/replaynes"
      - "$(RN_MACOS)/Sources/Core/C"
    SWIFT_OBJC_BRIDGING_HEADER: "$(RN_MACOS)/Sources/Core/C/Bridging.h"
    LIBRARY_SEARCH_PATHS:
      - "$(RN_ENGINE_BUILD_DIR)/$(PLATFORM_NAME)"
    OTHER_LDFLAGS: ["-lreplaynes_all", "-lc++"]
    GCC_C_LANGUAGE_STANDARD: c11
    # The String Catalogs are maintained by hand on this branch: building must never rewrite
    # apps/macos/Resources/Localizable.xcstrings (shared with main).
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

aggregateTargets:
  Engine:
    buildScripts:
      # The product's engine build (RN_ENGINE_SCRIPT): one static library libreplaynes_all.a per SDK.
      - name: Build the engine + frontend core for iOS (CMake)
        script: '"$RN_ENGINE_SCRIPT" "$PLATFORM_NAME"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(RN_ENGINE_BUILD_DIR)/$(PLATFORM_NAME)/libreplaynes_all.a"

targets:
  ReplayNES:
    type: application
    platform: iOS
    sources:
      # Shared with macOS (referenced in place).
      - path: ../macos/Sources/Core
      - path: ../macos/Sources/App/EmulationController.swift
      - path: ../macos/Sources/App/Runtime.swift
      - path: ../macos/Sources/App/LatencyMeter.swift
      - path: ../macos/Sources/App/MetalView.swift
      - path: ../macos/Sources/App/CRTSettings.swift
      - path: ../macos/Sources/App/TimelineActions.swift
      - path: ../macos/Sources/App/Filmstrip.swift
      - path: ../macos/Sources/App/SeekMarkers.swift
      - path: ../macos/Sources/App/InputManager.swift
      - path: ../macos/Sources/App/QuickMenu/QuickMenuController.swift
      - path: ../macos/Resources/Localizable.xcstrings
      # iOS only.
      - path: Sources
      - path: Resources/IOS.xcstrings
      # Apache-2.0 notice of the ported Brickboy touch controller (About › Touch Controller).
      - path: ThirdParty/brickboy/LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - target: Engine
      # "Add to <product>" (multi-file shares), embedded in PlugIns.
      - target: ReplayNESShare
      - sdk: GameController.framework
      - sdk: Metal.framework
      - sdk: AVFoundation.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_MODULE_NAME: ReplayNESApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bundle id and team: the product's xcconfig (+ its Signing.local.xcconfig).
        # App Group shared with the Share Extension: group.<bundle id>.
        RN_APP_GROUP: "group.$(PRODUCT_BUNDLE_IDENTIFIER)"
    entitlements:
      properties:
        com.apple.security.application-groups: ["$(RN_APP_GROUP)"]
    info:
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        LSApplicationCategoryType: public.app-category.games
        ITSAppUsesNonExemptEncryption: false
        RNAppGroup: "$(RN_APP_GROUP)"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # ProMotion: allow the display link to ask for 120 Hz (docs/FRAME_PACING.md).
        CADisableMinimumFrameDurationOnPhone: true
        # Files app: On My iPhone › <product> (= Documents: ROM/, Projects/).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad

  # Share Extension "Add to <product>": a share of many files (Files › Select › Share) reaches the
  # app whole (iOS hands an app's own share entry only the first file): the extension copies every
  # item into the App Group's ShareInbox and the app imports them (Sources/Shared/ShareInbox.swift).
  # Bundle id <app>.share; App Group group.<app bundle id> on both (automatic signing registers them).
  # The product spec adds the display name and the activation rule (its file types).
  ReplayNESShare:
    type: app-extension
    platform: iOS
    sources:
      # Info.plist is the product's (its spec's info path; ReplayNES generates ShareExtension/Info.plist).
      - path: ShareExtension
        excludes: [Info.plist]
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_MODULE_NAME: ReplayNESShare
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).share"
        # The app's group: this target's bundle id without ".share".
        RN_APP_GROUP: "group.$(PRODUCT_BUNDLE_IDENTIFIER:base)"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: []
        LIBRARY_SEARCH_PATHS: []
        HEADER_SEARCH_PATHS: []
        SKIP_INSTALL: YES
    entitlements:
      properties:
        com.apple.security.application-groups: ["$(RN_APP_GROUP)"]
    info:
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        RNAppGroup: "$(RN_APP_GROUP)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"

  # Logic tests (no host app): the shared core layer, the iOS-only pure logic (feature gating,
  # the ported NESTERM touch gamepad and its layout) and the macOS core tests that do not need AppKit, on the simulator.
  ReplayNESTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../macos/Sources/Core
      - path: ../macos/Tests
        excludes:
          - ControllerLayoutTests.swift   # AppKit
      - path: Sources/Entitlements
      - path: Sources/Play/Brickboy/TouchGamepad.swift
      - path: Sources/Play/Brickboy/TouchLayout.swift
      - path: Sources/Play/ResumeCountdownLogic.swift
      - path: Sources/App/OrientationLock.swift
      - path: Sources/Support/L10n.swift
      - path: Sources/Library/ROMImport.swift
      - path: Sources/Shared
      - path: Tests
    dependencies:
      - target: Engine
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.replaynes.ios.tests
        PRODUCT_MODULE_NAME: ReplayNESTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # End-to-end touch gestures on the running app (simulator): synthesised multi-touch paths on
  # the ported NESTERM controller (scheme ReplayNESTouchUI; not part of the ReplayNES scheme's tests).
  ReplayNESUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ReplayNES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.replaynes.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReplayNES
        SWIFT_OBJC_BRIDGING_HEADER: UITests/EventSynthesis.h
        OTHER_LDFLAGS: []
        HEADER_SEARCH_PATHS: []

schemes:
  ReplayNESTouchUI:
    build:
      targets:
        ReplayNES: all
        ReplayNESUITests: [test]
    test:
      targets: [ReplayNESUITests]
  ReplayNES:
    build:
      targets:
        ReplayNES: all
        ReplayNESTests: [test]
    test:
      targets: [ReplayNESTests]
    run:
      config: Debug
    archive:
      config: Release
