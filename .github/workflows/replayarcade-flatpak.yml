# ReplayArcade (products/ReplayArcade in the monorepo): builds the Steam Deck / Linux Flatpak (x86_64) exactly as its
# scripts/release.sh does, but unsigned:
# the artifact is the OSTree repository flatpak-builder writes. scripts/release.sh signs and publishes it on the
# release machine (FLATPAK_RUN=<run id>), so no key ever reaches GitHub. No game data is involved.
name: ReplayArcade Flatpak x86_64

on:
  workflow_dispatch:
  push:
    branches: [main, 'ci/**']
    tags: ['replayarcade-v*']

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Flatpak, flatpak-builder and the 25.08 SDK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder \
            org.freedesktop.Sdk//25.08 org.freedesktop.Platform//25.08

      - name: FBNeo patches
        run: products/ReplayArcade/scripts/fbneo-patches.sh

      # The source tree is copied as scripts/release.sh copies it (no .git at any depth: a submodule's .git file
      # points outside the build and stops git apply in fbneo-patches.sh), outside the workspace.
      # dbus-run-session: the sandboxed flatpak-builder asks the host's flatpak about the SDK over the session
      # bus (flatpak-spawn --host), and a runner has no login session ("Unable to find sdk" without it).
      - name: flatpak-builder
        run: |
          W="$RUNNER_TEMP/flatpak"
          mkdir -p "$W/src"
          rsync -a --exclude='.git' --exclude='/build/' --exclude='/build-*' --exclude='/dist/' --exclude='/.flatpak-builder/' \
            --exclude='/third_party/nestopia/' \
            --exclude='/products/ReplayArcade/build/' --exclude='/products/ReplayArcade/third_party/fbneo/src/dep/mingw/' \
            --exclude='*.o' --exclude='*.a' --exclude='*.d' ./ "$W/src/"
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean --disable-updates --state-dir="$W/state" \
            --repo="$W/repo" "$W/build" "$W/src/products/ReplayArcade/packaging/linux/io.github.kathoc.ReplayArcade.yml"
          git rev-parse HEAD > "$W/repo/replayarcade-commit"
          (cd "$W/build/files" && find . -type f | sort) > "$W/repo/replayarcade-files"
          tar -C "$W" -cf "$RUNNER_TEMP/flatpak-repo.tar" repo

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-x86_64
          path: ${{ runner.temp }}/flatpak-repo.tar
          retention-days: 30
