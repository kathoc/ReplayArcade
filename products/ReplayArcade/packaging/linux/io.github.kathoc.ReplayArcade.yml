# ReplayArcade for Steam Deck / Linux (Flatpak), built from ReplayNES's sources with ReplayArcade's
# product profile, from the monorepo (ReplayNES at its root, ReplayArcade in products/ReplayArcade). Releases:
# scripts/release.sh; on the Deck: scripts/build-deck-flatpak.sh (copies the monorepo there).
id: io.github.kathoc.ReplayArcade
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: replayarcade-linux
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Controllers: /dev/input and /dev/hidraw* (Steam Deck built-in controls), as ReplayNES.
  - --device=all
  - --socket=pulseaudio
  # Steam's screen dimming / sleep held off while the app runs (game mode has no portal Inhibit;
  # Steam serves this name itself): apps/linux/src/steam_inhibit.h.
  - --talk-name=org.freedesktop.ScreenSaver
  # The Steam menu over the game (apps/linux/src/gamescope_overlay.h): gamescope says which app has the
  # input on its first Xwayland (:0, Steam's); a game launched by Steam runs on another one. Flatpak's
  # /tmp/.X11-unix holds only the app's own display socket, so :0 is reached through its abstract
  # socket, which needs the host's network namespace (nothing else uses the network).
  - --share=network
  - --filesystem=xdg-run/pipewire-0
  # ROM sets and projects: ~/Documents/ReplayArcade/{ROM,Projects}
  - --filesystem=xdg-documents/ReplayArcade:create
  - --filesystem=xdg-data/Trash:create
  # "Add to Steam": shortcuts.vdf and grid artwork of each local Steam account, as ReplayNES.
  - --filesystem=~/.local/share/Steam/userdata
  - --filesystem=~/.local/share/Steam/logs:ro
  # Under Steam every controller is a "Steam Virtual Gamepad"; Steam names the real ones in this file
  # (SteamVirtualGamepadInfo), which SDL reads: the Steam Deck's own controls are told from another
  # controller (player 1 goes to the other one). Steam rewrites it in place, so the file alone is enough.
  - --filesystem=~/.local/share/Steam/config/virtualgamepadinfo.txt:ro
modules:
  - name: replayarcade
    buildsystem: cmake-ninja
    subdir: apps/linux
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DRNL_BUILD_TESTS=OFF
      - -DRN_PRODUCT_FILE=/run/build/replayarcade/products/ReplayArcade/cmake/product.cmake
    sources:
      # The monorepo's root: ReplayNES's sources at the root, ReplayArcade in products/ReplayArcade.
      - type: dir
        path: ../../../..
        skip:
          - .git
          - .claude
          - build
          - build-linux-sdk
          - .flatpak-builder
          - dist
          - products/ReplayArcade/build
          - products/ReplayArcade/build-ios
          - products/ReplayArcade/build-mac
          - products/ReplayArcade/build-linux-sdk
          - products/ReplayArcade/dist
