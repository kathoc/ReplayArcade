# ReplayArcade for Steam Deck / Linux (Flatpak), built from ReplayNES's sources with ReplayArcade's
# product profile. Use scripts/build-deck-flatpak.sh: it copies ReplayArcade and ReplayNES's tree
# (third_party/replaynes) to the Deck and runs flatpak-builder there. Private build, not published.
id: io.github.kathoc.ReplayArcade
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: replayarcade-linux
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Controllers: /dev/input and /dev/hidraw* (Steam Deck built-in controls), as ReplayNES.
  - --device=all
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # ROM sets and projects: ~/Documents/ReplayArcade/{ROM,Projects}
  - --filesystem=xdg-documents/ReplayArcade:create
  - --filesystem=xdg-data/Trash:create
  # "Add to Steam": shortcuts.vdf and grid artwork of each local Steam account, as ReplayNES.
  - --filesystem=~/.local/share/Steam/userdata
  - --filesystem=~/.local/share/Steam/logs:ro
  # Under Steam every controller is a "Steam Virtual Gamepad"; Steam names the real ones in this file
  # (SteamVirtualGamepadInfo), which SDL reads: the Steam Deck's own controls are told from another
  # controller (player 1 goes to the other one). Steam rewrites it in place, so the file alone is enough.
  - --filesystem=~/.local/share/Steam/config/virtualgamepadinfo.txt:ro
modules:
  - name: replayarcade
    buildsystem: cmake-ninja
    subdir: third_party/replaynes/apps/linux
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DRNL_BUILD_TESTS=OFF
      - -DRN_PRODUCT_FILE=/run/build/replayarcade/cmake/product.cmake
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - build-linux-sdk
          - .flatpak-builder
          - dist
