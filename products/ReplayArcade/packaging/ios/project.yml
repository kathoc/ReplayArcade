# XcodeGen spec for ReplayArcade's iPhone app (PLAN A3). The app is ReplayNES's iPhone app (apps/ios of
# the ReplayNES tree REPLAYNES_DIR, branch ios) with ReplayArcade's product part: name, bundle id, icon,
# file types and the engine build (scripts/build-ios-engine.sh: FinalBurn Neo + ReplayArcade's core and
# product profile). Generated by scripts/build-ios.sh, which sets REPLAYNES_IOS_DIR (XcodeGen expands it).
include:
  - ${REPLAYNES_IOS_DIR}/common.yml
name: ReplayArcade
options:
  bundleIdPrefix: io.github.kathoc
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.3.4"
    CURRENT_PROJECT_VERSION: "1"
    RN_IOS_DIR: "${REPLAYNES_IOS_DIR}"
    RN_ENGINE_BUILD_DIR: "$(SRCROOT)/../../build-ios"
    RN_ENGINE_SCRIPT: "$(SRCROOT)/../../scripts/build-ios-engine.sh"
    # The engine script builds from the same ReplayNES tree as the Swift sources.
    REPLAYNES_DIR: "${REPLAYNES_IOS_DIR}/../.."
    # Product start-up hook (rn_product_startup in libreplaynes_all.a): FinalBurn Neo, set identity, ROM filter.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) RN_PRODUCT_HAS_STARTUP"

targets:
  ReplayNES:
    sources:
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ReplayArcade
        INFOPLIST_KEY_CFBundleDisplayName: ReplayArcade
    entitlements:
      path: Config/ReplayArcade.entitlements
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ReplayArcade
        NSHumanReadableCopyright: "ReplayArcade - personal build. Includes ReplayNES (GPL-2.0-or-later) and FinalBurn Neo (non-commercial licence)."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.kathoc.replayarcade.arcrec
            UTTypeDescription: ReplayArcade Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [arcrec]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ReplayArcade Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [io.github.kathoc.replayarcade.arcrec]

  ReplayNESShare:
    settings:
      base:
        PRODUCT_NAME: ReplayArcadeShare
    entitlements:
      path: Config/ReplayArcadeShare.entitlements
    info:
      path: Config/ShareInfo.plist
      properties:
        CFBundleDisplayName: Add to ReplayArcade
        NSExtension:
          NSExtensionAttributes:
            # Any number of files: ROM sets (zip) and ReplayArcade projects (packages).
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.data"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.zip-archive"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "io.github.kathoc.replayarcade.arcrec"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.apple.package"
              ).@count >= 1).@count >= 1
